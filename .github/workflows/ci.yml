name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Skill structure and manifests
        run: node .github/lint-skill.mjs

      - name: Script self-tests
        working-directory: skills/unhappy-path
        run: |
          node scripts/scan.mjs --test
          node scripts/fixtures.mjs --test
          node scripts/matrix.mjs --test

      - name: Scan passes known-good code
        run: node skills/unhappy-path/scripts/scan.mjs evals/fixtures/good

      - name: Scan still flags known-bad code
        run: |
          if node skills/unhappy-path/scripts/scan.mjs evals/fixtures/bad; then
            echo "scan.mjs passed code it must flag"; exit 1
          fi
